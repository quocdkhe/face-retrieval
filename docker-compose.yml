services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: face-retrieval-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
